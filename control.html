
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Live Control Panel</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#101014;color:white;font-family:Arial,sans-serif}
.container{max-width:500px;margin:auto}
h2{text-align:center}
.card{background:#1b1b23;padding:18px;border-radius:14px;margin-bottom:15px}
button{width:100%;padding:13px;border:0;border-radius:8px;background:#2563eb;color:white;font-weight:bold;margin-top:10px;cursor:pointer}
button.red{background:#dc2626}
button.green{background:#16a34a}
button:disabled{opacity:.5}
video{width:100%;background:#000;border-radius:10px;margin-top:10px}
.status{font-size:13px;color:#aaa;margin-top:10px}
input{width:100%;padding:11px;margin-top:8px;border:0;border-radius:7px;background:#292932;color:white}
</style>
</head>
<body>
<div class="container">
<h2>TikTok Live Control Panel</h2>

<div class="card">
<h3>📷 Kamera Host</h3>
<p>Aktifkan kamera untuk menampilkan video secara realtime di Display Studio.</p>
<video id="preview" autoplay muted playsinline></video>
<button class="green" id="start">AKTIFKAN KAMERA</button>
<button class="red" id="stop" disabled>MATIKAN KAMERA</button>
<div class="status" id="cameraStatus">Kamera belum aktif.</div>
</div>

<div class="card">
<h3>👤 Nama Host</h3>
<input id="hostName" placeholder="Masukkan nama host">
<button onclick="updateHostName()">UPDATE NAMA HOST</button>
</div>

<div class="card">
<h3>🖥️ Display Studio</h3>
<button onclick="window.open('display.html','display')">BUKA DISPLAY</button>
</div>
</div>

<script>
const channel = new BroadcastChannel('tiktok_live_channel');

let stream = null;
let peer = null;
let displayChannel = null;

const preview = document.getElementById('preview');
const startBtn = document.getElementById('start');
const stopBtn = document.getElementById('stop');
const statusText = document.getElementById('cameraStatus');

function send(type, data = {}) {
    channel.postMessage({type, ...data});
}

function updateHostName() {
    const label = document.getElementById('hostName').value.trim();
    send('UPDATE_HOST_LABEL', {label: label || 'Nama'});
}

function waitForDisplay() {
    return new Promise(resolve => {
        if (peer) peer.close();

        peer = new RTCPeerConnection({
            iceServers: [{urls:'stun:stun.l.google.com:19302'}]
        });

        peer.onicecandidate = event => {
            if (event.candidate) {
                displayChannel.postMessage({
                    type:'ICE',
                    candidate:event.candidate
                });
            }
        };

        peer.onconnectionstatechange = () => {
            statusText.textContent = 'Status koneksi: ' + peer.connectionState;
        };

        stream.getTracks().forEach(track => {
            peer.addTrack(track, stream);
        });

        displayChannel.onmessage = async event => {
            const data = event.data;

            try {
                if (data.type === 'READY') {
                    const offer = await peer.createOffer();
                    await peer.setLocalDescription(offer);

                    displayChannel.postMessage({
                        type:'OFFER',
                        description:peer.localDescription
                    });
                }

                if (data.type === 'ANSWER') {
                    await peer.setRemoteDescription(data.description);
                }

                if (data.type === 'ICE' && data.candidate) {
                    await peer.addIceCandidate(data.candidate);
                }
            } catch(error) {
                console.error(error);
            }
        };

        resolve();
    });
}

startBtn.onclick = async () => {
    try {
        startBtn.disabled = true;
        statusText.textContent = 'Meminta izin kamera...';

        if (!navigator.mediaDevices?.getUserMedia) {
            throw new Error('Kamera membutuhkan HTTPS atau localhost.');
        }

        stream = await navigator.mediaDevices.getUserMedia({
            video:{
                width:{ideal:1920},
                height:{ideal:1080},
                frameRate:{ideal:30}
            },
            audio:false
        });

        preview.srcObject = stream;

        displayChannel = new BroadcastChannel('tiktok_camera_connection');

        await waitForDisplay();

        startBtn.style.display = 'none';
        stopBtn.disabled = false;
        statusText.textContent = 'Kamera aktif. Menunggu Display terhubung...';

        stream.getVideoTracks()[0].addEventListener('ended', stopCamera);

    } catch(error) {
        console.error(error);
        alert('Kamera gagal diaktifkan: ' + error.message);
        startBtn.disabled = false;
        statusText.textContent = 'Kamera tidak aktif.';
    }
};

function stopCamera() {
    if(stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
    }

    if(peer) {
        peer.close();
        peer = null;
    }

    if(displayChannel) {
        displayChannel.postMessage({type:'STOP'});
        displayChannel.close();
        displayChannel = null;
    }

    preview.srcObject = null;

    startBtn.style.display = 'block';
    startBtn.disabled = false;
    stopBtn.disabled = true;

    statusText.textContent = 'Kamera telah dimatikan.';
}

stopBtn.onclick = stopCamera;

window.addEventListener('pagehide', () => {
    if(stream) stream.getTracks().forEach(track => track.stop());
    if(peer) peer.close();
});
</script>
</body>
</html>
