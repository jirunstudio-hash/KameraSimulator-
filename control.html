<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Live - Control Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #121216; color: #fff; padding: 20px; max-width: 600px; margin: 0 auto; }
        h2 { font-size: 1.2rem; margin-bottom: 15px; color: #00f2fe; }
        .card { background: #1e1e24; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        label { display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 5px; }
        input, select { width: 100%; padding: 8px 12px; background: #2a2a32; border: 1px solid #444; color: #fff; border-radius: 6px; margin-bottom: 10px; font-size: 0.9rem; }
        button { background: #007aff; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem; margin-right: 5px; margin-top: 5px; }
        button:hover { opacity: 0.9; }
        button.danger { background: #ff3b30; }
        button.secondary { background: #5856d6; }
    </style>
</head>
<body>

    <h2>TikTok Live Control Panel</h2>

    <div class="card">
        <label>Nama Host</label>
        <input type="text" id="hostNameInput" placeholder="Contoh: Faz Gading">
        <label>URL Video Host (MP4)</label>
        <input type="text" id="hostVideoInput" placeholder="Link video host...">
        <button onclick="updateHost()">Terapkan Host</button>
    </div>

    <div class="card">
        <h3>Pengaturan Slot (1 - 8)</h3>
        <label>Pilih Slot:</label>
        <select id="selectSlotNum">
            <option value="1">Slot 1</option>
            <option value="2">Slot 2</option>
            <option value="3">Slot 3</option>
            <option value="4">Slot 4</option>
            <option value="5">Slot 5</option>
            <option value="6">Slot 6</option>
            <option value="7">Slot 7</option>
            <option value="8">Slot 8</option>
        </select>

        <label>Nama TikTok Target / Penonton</label>
        <input type="text" id="targetNameInput" placeholder="Contoh: @BudiOfficial atau Budi">

        <label>Tipe Media</label>
        <select id="mediaTypeSelect">
            <option value="empty">Kosong (Default)</option>
            <option value="image">Foto Profil (Lingkar)</option>
            <option value="video">Video Media</option>
        </select>

        <label>URL Media (Foto/Video Link)</label>
        <input type="text" id="mediaUrlInput" placeholder="https://...">

        <label>Target / Poin Awal</label>
        <input type="number" id="poinInput" value="0">

        <button onclick="applySlot()">Simpan / Update Slot</button>
        <button class="secondary" onclick="clearMediaOnly()">Hapus Foto/Video Saja</button>
        <button class="danger" onclick="clearSlotTotal()">Hapus / Kosongkan Slot</button>
    </div>

    <div class="card">
        <h3>Kirim Gift & Tambah Poin</h3>
        <label>Pilih Slot Tujuan Poin:</label>
        <select id="giftTargetSlot">
            <option value="1">Slot 1</option>
            <option value="2">Slot 2</option>
            <option value="3">Slot 3</option>
            <option value="4">Slot 4</option>
            <option value="5">Slot 5</option>
            <option value="6">Slot 6</option>
            <option value="7">Slot 7</option>
            <option value="8">Slot 8</option>
        </select>
        <label>URL Video Gift (Green Screen/Transparan)</label>
        <input type="text" id="giftVideoUrl" placeholder="Link video gift.mp4">
        <label>Tambah Poin (Default 44999)</label>
        <input type="number" id="giftIncrement" value="44999">
        <button onclick="triggerGift()">Putar Gift & Tambah Poin</button>
    </div>

    <script>
        const channel = new BroadcastChannel('tiktok_live_channel');

        function cleanName(raw) {
            if(!raw) return '';
            let val = raw.trim();
            if(val.startsWith('@')) val = val.substring(1);
            return val;
        }

        function updateHost() {
            const label = document.getElementById('hostNameInput').value;
            const src = document.getElementById('hostVideoInput').value;
            if(label) channel.postMessage({ type: 'UPDATE_HOST_LABEL', label });
            if(src) channel.postMessage({ type: 'UPDATE_HOST_VIDEO', src });
        }

        function applySlot() {
            const slotNum = document.getElementById('selectSlotNum').value;
            const nameInput = cleanName(document.getElementById('targetNameInput').value);
            const mediaType = document.getElementById('mediaTypeSelect').value;
            const mediaSrc = document.getElementById('mediaUrlInput').value;
            const initialPoin = parseInt(document.getElementById('poinInput').value) || 0;

            channel.postMessage({
                type: 'UPDATE_SLOT',
                slotNum, mediaType, nameInput, initialPoin, mediaSrc, action: 'update'
            });
        }

        function clearMediaOnly() {
            const slotNum = document.getElementById('selectSlotNum').value;
            channel.postMessage({ type: 'UPDATE_SLOT', slotNum, action: 'clear_media' });
        }

        function clearSlotTotal() {
            const slotNum = document.getElementById('selectSlotNum').value;
            channel.postMessage({ type: 'UPDATE_SLOT', slotNum, action: 'clear_slot' });
        }

        function triggerGift() {
            const targetSlot = document.getElementById('giftTargetSlot').value;
            const src = document.getElementById('giftVideoUrl').value;
            const increment = parseInt(document.getElementById('giftIncrement').value) || 44999;
            if(src) {
                channel.postMessage({ type: 'PLAY_GIFT', targetSlot, src, increment });
            }
        }
    </script>
</body>
</html>
