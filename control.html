<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Panel - TikTok Live</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: #121216; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .panel { max-width: 500px; width: 100%; display: flex; flex-direction: column; gap: 15px; }
        .card { background: #1c1c24; border: 1px solid #2e2e3a; border-radius: 10px; padding: 15px; }
        h3 { font-size: 0.95rem; margin-bottom: 10px; color: #4facfe; }
        button { padding: 10px 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; }
        .btn-green { background: #10b981; }
        .btn-green:hover { background: #059669; }
        .btn-red { background: #ef4444; }
        .btn-red:hover { background: #dc2626; }
        .btn-blue { background: #2563eb; }
        input, select { width: 100%; padding: 8px 10px; background: #2b2b36; border: 1px solid #444; color: #fff; border-radius: 6px; margin-top: 4px; margin-bottom: 8px; }
    </style>
</head>
<body>

    <div class="panel">
        <!-- KONTROL KAMERA HOST -->
        <div class="card">
            <h3>Kamera Host Display</h3>
            <p style="font-size:0.75rem; color:#aaa; margin-bottom:10px;">
                Klik tombol di bawah untuk menampilkan kamera langsung di kotak Host display:
            </p>
            <div style="display:flex; gap:10px;">
                <button class="btn-green" style="flex:1;" onclick="sendCameraAction('start')">Aktifkan Kamera Host</button>
                <button class="btn-red" style="flex:1;" onclick="sendCameraAction('stop')">Matikan Kamera Host</button>
            </div>
        </div>

        <!-- KONTROL NAMA HOST -->
        <div class="card">
            <h3>Nama Host</h3>
            <input type="text" id="hostName" value="Faz Gading" placeholder="Nama Host...">
            <button class="btn-blue" style="width:100%;" onclick="updateHostName()">Ganti Nama Host</button>
        </div>

        <!-- KONTROL KOMAL SLOT -->
        <div class="card">
            <h3>Kelola Komal Slot (1 - 8)</h3>
            <select id="slotSelect">
                <option value="1">Slot 1</option><option value="2">Slot 2</option>
                <option value="3">Slot 3</option><option value="4">Slot 4</option>
                <option value="5">Slot 5</option><option value="6">Slot 6</option>
                <option value="7">Slot 7</option><option value="8">Slot 8</option>
            </select>
            <input type="text" id="slotName" placeholder="Nama Penonton Komal">
            <input type="number" id="slotCoin" value="0" placeholder="Koin">
            <input type="text" id="slotImg" placeholder="URL Foto Profil">
            
            <div style="display:flex; gap:8px;">
                <button class="btn-green" style="flex:1;" onclick="setSlot()">Pasang Komal</button>
                <button class="btn-red" style="flex:1;" onclick="clearSlot()">Kosongkan</button>
            </div>
        </div>
    </div>

    <script>
        const channel = new BroadcastChannel('tiktok_live_channel');

        function sendCameraAction(action) {
            channel.postMessage({
                type: 'HOST_CAMERA_ACTION',
                action: action
            });
        }

        function updateHostName() {
            const name = document.getElementById('hostName').value;
            channel.postMessage({ type: 'UPDATE_HOST_LABEL', label: name });
        }

        function setSlot() {
            const slot = parseInt(document.getElementById('slotSelect').value);
            channel.postMessage({
                type: 'UPDATE_SLOT',
                slotNum: slot,
                nameInput: document.getElementById('slotName').value,
                initialPoin: parseInt(document.getElementById('slotCoin').value) || 0,
                profileImg: document.getElementById('slotImg').value || null
            });
        }

        function clearSlot() {
            const slot = parseInt(document.getElementById('slotSelect').value);
            channel.postMessage({
                type: 'UPDATE_SLOT',
                slotNum: slot,
                action: 'clear_slot'
            });
        }
    </script>
</body>
</html>
