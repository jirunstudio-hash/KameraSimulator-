<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Studio - TikTok Live</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #050505; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }

        .phone-screen { 
            height: 95vh; aspect-ratio: 9 / 16; background: #000; 
            border: 2px solid #333; border-radius: 12px; position: relative; 
            overflow: hidden; display: flex; flex-direction: column; padding: 10px; 
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .live-layout { display: flex; gap: 6px; width: 100%; height: 100%; z-index: 10; }

        /* KOTAK HOST */
        .host-box { 
            flex: 1 1 0; min-width: 0; background: #1f1f1f; border-radius: 8px; 
            overflow: hidden; position: relative; display: flex; justify-content: center; 
            align-items: center; border: 1.5px solid rgba(255, 255, 255, 0.4); 
        }
        .host-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .host-placeholder { color: #888; font-size: 0.85rem; font-weight: bold; text-align: center; }

        .host-top-pill { position: absolute; top: 6px; left: 6px; z-index: 10; }
        .blue-host-badge { background: #00d2ff; color: #000; font-size: 0.45rem; font-weight: 800; padding: 2px 5px; border-radius: 4px; text-transform: uppercase; }

        .host-bottom-pill { position: absolute; bottom: 6px; left: 6px; background: rgba(0,0,0,0.55); border-radius: 6px; padding: 2px 6px; z-index: 10; }
        .host-bottom-text { font-size: 0.42rem; color: #fff; font-weight: 500; }

        /* KOMAL GRID */
        .komal-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; width: 45%; flex-shrink: 0; }
        .slot-box { width: 100%; aspect-ratio: 1 / 1; background: rgba(255, 255, 255, 0.08); border-radius: 8px; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1.5px solid rgba(255, 255, 255, 0.3); }
        
        .slot-media { width: 70%; height: 70%; object-fit: cover; border-radius: 50%; display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -55%); }
        .slot-icon { color: #aaa; font-size: 1rem; }
        .slot-req { color: #aaa; font-size: 0.5rem; }

        .slot-coin-badge { position: absolute; top: 4px; left: 4px; display: flex; align-items: center; gap: 3px; background: rgba(0,0,0,0.45); padding: 1px 4px; border-radius: 10px; z-index: 6; }
        .coin-icon { width: 9px; height: 9px; background: #00d2ff; border-radius: 50%; }
        .coin-count { font-size: 0.42rem; color: #fff; font-weight: 600; }

        .slot-bottom-bar { position: absolute; bottom: 4px; left: 4px; right: 4px; display: flex; align-items: center; justify-content: space-between; z-index: 5; }
        .slot-name-pill { background: rgba(0,0,0,0.55); color: #fff; font-size: 0.42rem; padding: 1px 4px; border-radius: 8px; }
        .mic-icon-svg { width: 10px; height: 10px; fill: #fff; }

        /* GIFT OVERLAY */
        .gift-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 30; pointer-events: none; }
        #giftCanvas { width: 100%; height: 100%; object-fit: cover; display: none; }
    </style>
</head>
<body>

    <div class="phone-screen">
        <div class="live-layout">
            <!-- HOST -->
            <div class="host-box">
                <div class="host-top-pill"><span class="blue-host-badge">Host</span></div>
                <div id="hostPlaceholder" class="host-placeholder">Host Video</div>
                <video id="hostVideo" class="host-video" loop autoplay muted style="display:none;"></video>
                <div class="host-bottom-pill"><span class="host-bottom-text" id="hostBottomText">Faz Gading</span></div>
            </div>

            <!-- KOMAL -->
            <div class="komal-grid">
                <script>
                    for(let i = 1; i <= 8; i++) {
                        document.write(`
                            <div class="slot-box" id="slot-${i}">
                                <div class="slot-coin-badge" id="coin-badge-${i}" style="display:none;">
                                    <div class="coin-icon"></div>
                                    <span class="coin-count" id="coincount-slot-${i}">0</span>
                                </div>
                                <span class="slot-icon" id="icon-${i}">+</span>
                                <span class="slot-req" id="req-${i}">Request</span>
                                <img id="img-slot-${i}" class="slot-media">
                                <video id="vid-slot-${i}" class="slot-media" loop playsinline muted></video>
                                <div class="slot-bottom-bar" id="bottombar-slot-${i}" style="display:none;">
                                    <div class="slot-name-pill"><span id="nametext-slot-${i}">Slot ${i}</span></div>
                                    <svg class="mic-icon-svg" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z" opacity="0.3"/><path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-3 0c0 .5-.08.98-.23 1.43l4.09 4.09 1.41-1.41L3.51 2.27 2.1 3.69l4.18 4.18C6.09 8.44 6 9.21 6 10v1h2v-1c0-.28.03-.55.08-.82l2.1 2.1C10.06 11.53 10 11.76 10 12c0 1.1.9 2 2 2 .24 0 .47-.06.72-.18l3.11 3.11C14.66 17.5 13.38 18 12 18c-3.31 0-6-2.69-6-6H4c0 4.07 3.06 7.43 7 7.93V22h2v-2.07c1.47-.19 2.84-.77 3.99-1.63l2.32 2.32 1.41-1.41L3.51 2.27z"/></svg>
                                </div>
                            </div>
                        `);
                    }
                </script>
            </div>
        </div>

        <div class="gift-overlay">
            <video id="giftVideo" playsinline style="display:none;"></video>
            <canvas id="giftCanvas"></canvas>
        </div>
    </div>

    <script>
        const channel = new BroadcastChannel('tiktok_live_channel');

        channel.onmessage = (event) => {
            const data = event.data;

            if (data.type === 'UPDATE_HOST_LABEL') {
                document.getElementById('hostBottomText').innerText = data.label || 'Nama';
            } 
            else if (data.type === 'UPDATE_HOST_VIDEO') {
                const videoElem = document.getElementById('hostVideo');
                const placeholder = document.getElementById('hostPlaceholder');
                videoElem.src = data.src;
                videoElem.style.display = 'block';
                placeholder.style.display = 'none';
                videoElem.play();
            } 
            else if (data.type === 'UPDATE_SLOT') {
                const { slotNum, mediaType, nameInput, poinInput, mediaSrc } = data;
                const coinBadge = document.getElementById(`coin-badge-${slotNum}`);
                const coincountElem = document.getElementById(`coincount-slot-${slotNum}`);
                const bottomBar = document.getElementById(`bottombar-slot-${slotNum}`);
                const nameText = document.getElementById(`nametext-slot-${slotNum}`);
                const imgElem = document.getElementById(`img-slot-${slotNum}`);
                const vidElem = document.getElementById(`vid-slot-${slotNum}`);
                const iconElem = document.getElementById(`icon-${slotNum}`);
                const reqElem = document.getElementById(`req-${slotNum}`);

                imgElem.style.display = 'none';
                vidElem.style.display = 'none';
                vidElem.pause();

                if (mediaType === 'empty') {
                    iconElem.style.display = 'inline';
                    reqElem.style.display = 'inline';
                    bottomBar.style.display = 'none';
                    coinBadge.style.display = 'none';
                    return;
                }

                coinBadge.style.display = 'flex';
                coincountElem.innerText = poinInput || '0';

                if (nameInput) {
                    nameText.innerText = nameInput;
                    bottomBar.style.display = 'flex';
                } else {
                    bottomBar.style.display = 'none';
                }

                if (mediaSrc) {
                    iconElem.style.display = 'none';
                    reqElem.style.display = 'none';
                    if (mediaType === 'image') {
                        imgElem.src = mediaSrc;
                        imgElem.style.display = 'block';
                    } else if (mediaType === 'video') {
                        vidElem.src = mediaSrc;
                        vidElem.style.display = 'block';
                        vidElem.play();
                    }
                }
            }
            else if (data.type === 'PLAY_GIFT') {
                playGiftVideo(data.src);
            }
        };

        function playGiftVideo(src) {
            const giftVideo = document.getElementById('giftVideo');
            const canvas = document.getElementById('giftCanvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });

            giftVideo.src = src;
            canvas.style.display = 'block';
            giftVideo.currentTime = 0;
            giftVideo.play();

            function renderFrame() {
                if (giftVideo.paused || giftVideo.ended) {
                    canvas.style.display = 'none';
                    return;
                }
                canvas.width = giftVideo.videoWidth || 360;
                canvas.height = giftVideo.videoHeight || 640;
                ctx.drawImage(giftVideo, 0, 0, canvas.width, canvas.height);

                const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = frame.data;
                for (let i = 0; i < data.length; i += 4) {
                    let r = data[i], g = data[i + 1], b = data[i + 2];
                    if (g > 60 && g > r * 1.2 && g > b * 1.2) {
                        data[i + 3] = 0;
                    }
                }
                ctx.putImageData(frame, 0, 0);
                requestAnimationFrame(renderFrame);
            }

            giftVideo.addEventListener('play', renderFrame);
        }
    </script>
</body>
</html>
