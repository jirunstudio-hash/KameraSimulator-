<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Studio - TikTok Live</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0b0b0e; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }

        /* BINGKAI HP DISPLAY */
        .phone-screen { 
            height: 100vh; 
            width: 100vw;
            max-width: 420px; 
            max-height: 840px;
            background: #000; 
            position: relative; 
            overflow: hidden; 
            display: flex; 
            justify-content: center;
            align-items: flex-start;
            padding: 10px 10px 0 10px; 
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            border: 2px solid #222;
            border-radius: 20px;
        }

        /* LAYOUT UTAMA: MENTOK ATAS */
        .live-layout { 
            display: flex; 
            gap: 8px; 
            width: 100%; 
            max-width: 400px;
            z-index: 10; 
            align-items: stretch; /* Mengubah flex-start menjadi stretch agar tinggi host mengikuti grid secara fleksibel */
            margin-top: 0px; 
        }

        /* KOTAK HOST (KIRI) - Tinggi otomatis menyesuaikan layout flex */
        .host-box { 
            flex: 1; 
            height: auto; /* Menggunakan auto agar stretch flexbox bekerja sempurna tanpa bentrok */
            background: #16161c; 
            border-radius: 12px; 
            overflow: hidden; 
            position: relative; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }
        .host-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .host-placeholder { color: #666; font-size: 0.8rem; font-weight: 500; text-align: center; }

        .host-top-pill { position: absolute; top: 8px; left: 8px; z-index: 10; }
        .blue-host-badge { background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); color: #000; font-size: 0.5rem; font-weight: 800; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 2px 6px rgba(0,242,254,0.3); }

        .host-bottom-pill { 
            position: absolute; 
            bottom: 8px; 
            left: 8px; 
            max-width: calc(100% - 16px);
            background: rgba(0, 0, 0, 0.65); 
            backdrop-filter: blur(6px); 
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 8px; 
            padding: 4px 10px; 
            z-index: 10; 
        }
        .host-bottom-text { 
            font-size: 0.55rem; 
            color: #fff; 
            font-weight: 600; 
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* GRID 8 KOTAK KOMAL (KANAN) */
        .komal-grid { 
            width: 190px; 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            grid-template-rows: repeat(4, 1fr); 
            gap: 6px; 
            flex-shrink: 0;
        }

        .slot-box { 
            width: 100%; 
            aspect-ratio: 1 / 1; 
            background: #16161c; 
            border-radius: 10px; 
            position: relative; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }
        
        .slot-media { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: none; 
            position: absolute; 
            top: 0; 
            left: 0; 
        }

        .slot-icon { color: #555; font-size: 0.9rem; margin-bottom: 2px; font-weight: bold; }
        .slot-req { color: #777; font-size: 0.45rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }

        /* COIN BADGE top-left */
        .slot-coin-badge { 
            position: absolute; 
            top: 4px; 
            left: 4px; 
            display: flex; 
            align-items: center; 
            gap: 2px; 
            background: rgba(0, 0, 0, 0.6); 
            backdrop-filter: blur(4px);
            padding: 1px 5px; 
            border-radius: 6px; 
            z-index: 6; 
            border: 1px solid rgba(255,255,255,0.1);
        }
        .coin-icon { width: 8px; height: 8px; background: #fe2c55; border-radius: 50%; box-shadow: 0 0 4px #fe2c55; }
        .coin-count { font-size: 0.45rem; color: #fff; font-weight: 700; }

        /* NAMA & MIC BAR bottom */
        .slot-bottom-bar { 
            position: absolute; 
            bottom: 4px; 
            left: 4px; 
            right: 4px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            z-index: 5; 
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            padding: 2px 4px;
            border-radius: 6px;
        }
        .slot-name-pill { color: #fff; font-size: 0.45rem; font-weight: 500; max-width: 75%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mic-icon-svg { width: 9px; height: 9px; fill: #00f2fe; }

        /* GIFT OVERLAY FULL LAYAR */
        .gift-overlay { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 30; 
            pointer-events: none; 
            display: none; 
            background: transparent;
        }
        #giftVideo { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            position: absolute;
            top: 0;
            left: 0;
        }
        #giftCanvas { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>

    <div class="phone-screen">
        <div class="live-layout">
            <!-- HOST BOX -->
            <div class="host-box" id="hostBox">
                <div class="host-top-pill"><span class="blue-host-badge">Host</span></div>
                <div id="hostPlaceholder" class="host-placeholder">Host Video</div>
                <video id="hostVideo" class="host-video" loop autoplay muted style="display:none;"></video>
                <div class="host-bottom-pill"><span class="host-bottom-text" id="hostBottomText">Faz Gading</span></div>
            </div>

            <!-- 8 KOMAL GRID -->
            <div class="komal-grid" id="komalGrid">
                <script>
                    for(let i = 1; i <= 8; i++) {
                        document.write(`
                            <div class="slot-box" id="slot-${i}">
                                <div class="slot-coin-badge" id="coin-badge-${i}" style="display:none;">
                                    <div class="coin-icon"></div>
                                    <span class="coin-count" id="coincount-slot-${i}">0</span>
                                </div>
                                <span class="slot-icon" id="icon-${i}">+</span>
                                <span class="slot-req" id="req-${i}">Request</span>
                                <img id="img-slot-${i}" class="slot-media">
                                <video id="vid-slot-${i}" class="slot-media" loop playsinline muted></video>
                                <div class="slot-bottom-bar" id="bottombar-slot-${i}" style="display:none;">
                                    <div class="slot-name-pill"><span id="nametext-slot-${i}">Slot ${i}</span></div>
                                    <svg class="mic-icon-svg" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/></svg>
                                </div>
                            </div>
                        `);
                    }
                </script>
            </div>
        </div>

        <div class="gift-overlay" id="giftOverlayContainer">
            <video id="giftVideo" playsinline style="display:none;"></video>
            <canvas id="giftCanvas"></canvas>
        </div>
    </div>

    <script>
        // Fungsi sinkronisasi tinggi dihapus karena bentrok dengan flex stretch CSS
        const channel = new BroadcastChannel('tiktok_live_channel');

        channel.onmessage = (event) => {
            const data = event.data;

            if (data.type === 'UPDATE_HOST_LABEL') {
                document.getElementById('hostBottomText').innerText = data.label || 'Nama';
            } 
            else if (data.type === 'UPDATE_HOST_VIDEO') {
                const videoElem = document.getElementById('hostVideo');
                const placeholder = document.getElementById('hostPlaceholder');
                videoElem.src = data.src;
                videoElem.style.display = 'block';
                placeholder.style.display = 'none';
                videoElem.play();
            } 
            else if (data.type === 'UPDATE_SLOT') {
                const { slotNum, mediaType, nameInput, poinInput, mediaSrc } = data;
                const coinBadge = document.getElementById(`coin-badge-${slotNum}`);
                const coincountElem = document.getElementById(`coincount-slot-${slotNum}`);
                const bottomBar = document.getElementById(`bottombar-slot-${slotNum}`);
                const nameText = document.getElementById(`nametext-slot-${slotNum}`);
                const imgElem = document.getElementById(`img-slot-${slotNum}`);
                const vidElem = document.getElementById(`vid-slot-${slotNum}`);
                const iconElem = document.getElementById(`icon-${slotNum}`);
                const reqElem = document.getElementById(`req-${slotNum}`);

                imgElem.style.display = 'none';
                vidElem.style.display = 'none';
                vidElem.pause();

                if (mediaType === 'empty') {
                    iconElem.style.display = 'inline';
                    reqElem.style.display = 'inline';
                    bottomBar.style.display = 'none';
                    coinBadge.style.display = 'none';
                    return;
                }

                coinBadge.style.display = 'flex';
                coincountElem.innerText = poinInput || '0';

                if (nameInput) {
                    nameText.innerText = nameInput;
                    bottomBar.style.display = 'flex';
                } else {
                    bottomBar.style.display = 'none';
                }

                if (mediaSrc) {
                    iconElem.style.display = 'none';
                    reqElem.style.display = 'none';
                    if (mediaType === 'image') {
                        imgElem.src = mediaSrc;
                        imgElem.style.display = 'block';
                    } else if (mediaType === 'video') {
                        vidElem.src = mediaSrc;
                        vidElem.style.display = 'block';
                        vidElem.play();
                    }
                }
            }
            else if (data.type === 'PLAY_GIFT') {
                playGiftVideo(data.src);
            }
        };

        function playGiftVideo(src) {
            const overlayContainer = document.getElementById('giftOverlayContainer');
            const giftVideo = document.getElementById('giftVideo');
            const canvas = document.getElementById('giftCanvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });

            giftVideo.src = src;
            overlayContainer.style.display = 'block';
            giftVideo.currentTime = 0;
            giftVideo.play();

            function renderFrame() {
                if (giftVideo.paused || giftVideo.ended) {
                    overlayContainer.style.display = 'none';
                    return;
                }
                canvas.width = giftVideo.videoWidth || 420;
                canvas.height = giftVideo.videoHeight || 840;
                ctx.drawImage(giftVideo, 0, 0, canvas.width, canvas.height);

                const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = frame.data;
                for (let i = 0; i < data.length; i += 4) {
                    let r = data[i], g = data[i + 1], b = data[i + 2];
                    if (g > 60 && g > r * 1.2 && g > b * 1.2) {
                        data[i + 3] = 0;
                    }
                }
                ctx.putImageData(frame, 0, 0);
                requestAnimationFrame(renderFrame);
            }

            giftVideo.addEventListener('play', renderFrame);
        }
    </script>
</body>
</html>
