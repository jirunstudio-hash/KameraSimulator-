<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Studio - TikTok Live HD</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0b0b0e; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }

        .phone-screen { 
            height: 100vh; width: 100vw; max-width: 420px; max-height: 840px;
            background: #000; position: relative; overflow: hidden; display: flex; 
            justify-content: center; align-items: flex-start; padding: 10px 10px 0 10px; 
            box-shadow: 0 0 40px rgba(0,0,0,0.8); border: 2px solid #222; border-radius: 20px;
        }

        .live-layout { display: flex; gap: 8px; width: 100%; max-width: 400px; z-index: 10; align-items: stretch; }

        .host-box { 
            flex: 1; height: auto; background: #16161c; border-radius: 12px; overflow: hidden; 
            position: relative; display: flex; justify-content: center; align-items: center; 
            border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }
        .host-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; }
        #hostCameraImg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; display: none; }
        .host-placeholder { color: #666; font-size: 0.8rem; font-weight: 500; text-align: center; z-index: 1; }

        .host-top-pill { position: absolute; top: 8px; left: 8px; z-index: 10; }
        .blue-host-badge { background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); color: #000; font-size: 0.5rem; font-weight: 800; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }

        .host-bottom-pill { 
            position: absolute; bottom: 8px; left: 8px; max-width: calc(100% - 16px);
            background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(6px); 
            border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 4px 10px; z-index: 10; 
        }
        .host-bottom-text { font-size: 0.55rem; color: #fff; font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .komal-grid { width: 190px; display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(4, 1fr); gap: 6px; flex-shrink: 0; }

        .slot-box { 
            width: 100%; aspect-ratio: 1 / 1; background: #16161c; border-radius: 10px; 
            position: relative; overflow: hidden; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; border: 1px solid rgba(255, 255, 255, 0.08); 
            transition: border-color 0.2s ease;
        }
        
        .slot-box.active-media { border: 1.5px solid #666666 !important; }
        
        .slot-circle-img { width: 55px; height: 55px; border-radius: 50%; object-fit: cover; display: none; position: absolute; z-index: 3; border: 2px solid rgba(255, 255, 255, 0.2); }

        .slot-icon { color: #555; font-size: 0.9rem; margin-bottom: 2px; font-weight: 900; z-index: 2; -webkit-text-stroke: 0.4px #555; }
        .slot-req { color: #777; font-size: 0.45rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; z-index: 2; }

        .slot-coin-badge { 
            position: absolute; top: 4px; left: 4px; display: flex; align-items: center; gap: 2px; 
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); padding: 1px 4px; 
            border-radius: 8px; z-index: 6; border: 1px solid rgba(255,255,255,0.1);
        }
        .blue-star-circle { width: 12px; height: 12px; background: #007aff; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .star-icon-svg { width: 8px; height: 8px; fill: #fff; }
        .coin-count { font-size: 0.45rem; color: #fff; font-weight: 700; }

        .slot-name-pill { 
            position: absolute; bottom: 4px; left: 4px; max-width: calc(100% - 28px);
            display: flex; align-items: center; gap: 2px; z-index: 5; 
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); padding: 2px 6px; border-radius: 6px;
        }
        .slot-name-text { color: #fff; font-size: 0.45rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .slot-plus-icon { color: #fff; font-size: 0.5rem; font-weight: 900; -webkit-text-stroke: 0.4px #fff; flex-shrink: 0; }
        
        .mic-container { 
            position: absolute; bottom: 4px; right: 4px; z-index: 5;
            width: 14px; height: 14px; display: flex; align-items: center; justify-content: center; 
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); border-radius: 4px;
        }
        .mic-icon-svg { width: 9px; height: 9px; fill: #fff; }
        .mic-mute-line { 
            position: absolute; width: 10px; height: 1.2px; 
            background-color: #ff3b30; transform: rotate(-45deg); display: block; 
        }

        /* ===== SISTEM RASIO ASLI TIKTOK LIVE (9:16 FULL OVERLAY) ===== */
        .gift-overlay { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 40; 
            pointer-events: none; 
            display: none; 
            background: transparent; 
        }
        #giftVideo { display: none; }
        #giftCanvas { 
            width: 100%; 
            height: 100%; 
            position: absolute; 
            top: 0; 
            left: 0; 
            object-fit: cover; /* Standar sistem 9:16 TikTok */
            object-position: center bottom;
            image-rendering: -webkit-optimize-contrast; 
        }

        /* BANNER NOTIFIKASI GIFT KHAS TIKTOK LIVE */
        .tiktok-gift-banner {
            position: absolute;
            bottom: 60px;
            left: 12px;
            z-index: 45;
            display: none;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.68);
            backdrop-filter: blur(8px);
            padding: 4px 14px 4px 5px;
            border-radius: 30px;
            border: 1px solid rgba(255, 215, 0, 0.5);
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            animation: slideInGift 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }
        @keyframes slideInGift {
            0% { transform: translateX(-120px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
        .gift-banner-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid #ffd700;
            object-fit: cover;
            background: #222;
        }
        .gift-banner-text {
            display: flex;
            flex-direction: column;
        }
        .gift-banner-text b {
            font-size: 0.65rem;
            color: #fff;
            max-width: 95px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .gift-banner-text span {
            font-size: 0.5rem;
            color: #ffd700;
            font-weight: 700;
        }
        .gift-banner-combo {
            display: flex;
            align-items: baseline;
            font-style: italic;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255,215,0,0.8), 0 2px 4px #000;
            margin-left: 6px;
            animation: bounceCombo 0.4s ease-out;
        }
        .combo-text { font-size: 0.85rem; }
        .combo-num { font-size: 1.25rem; }
        @keyframes bounceCombo {
            0% { transform: scale(0.3); }
            60% { transform: scale(1.35); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="phone-screen" id="displayContainer">
        <div class="live-layout">
            <div class="host-box" id="hostBox">
                <div class="host-top-pill"><span class="blue-host-badge">Host</span></div>
                <div id="hostPlaceholder" class="host-placeholder">Host Video / Kamera</div>
                <video id="hostVideo" class="host-video" loop autoplay playsinline muted></video>
                <img id="hostCameraImg" alt="Host Cam">
                <div class="host-bottom-pill"><span class="host-bottom-text" id="hostBottomText">Faz Gading</span></div>
            </div>

            <div class="komal-grid" id="komalGrid">
                <script>
                    for(let i = 1; i <= 8; i++) {
                        document.write(`
                            <div class="slot-box" id="slot-${i}">
                                <div class="slot-coin-badge" id="coin-badge-${i}" style="display:none;">
                                    <div class="blue-star-circle">
                                        <svg class="star-icon-svg" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                                    </div>
                                    <span class="coin-count" id="coincount-slot-${i}">0</span>
                                </div>
                                <span class="slot-icon" id="icon-${i}">+</span>
                                <span class="slot-req" id="req-${i}">Request</span>
                                
                                <img id="img-slot-${i}" class="slot-circle-img" referrerpolicy="no-referrer">
                                
                                <div class="slot-name-pill" id="namepill-slot-${i}" style="display:none;">
                                    <span class="slot-name-text" id="nametext-slot-${i}">Slot ${i}</span>
                                    <span class="slot-plus-icon">+</span>
                                </div>

                                <div class="mic-container" id="mic-slot-${i}" style="display:none;">
                                    <svg class="mic-icon-svg" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/></svg>
                                    <div class="mic-mute-line"></div>
                                </div>
                            </div>
                        `);
                    }
                </script>
            </div>
        </div>

        <!-- Banner Combo Gift TikTok Asli -->
        <div class="tiktok-gift-banner" id="tiktokGiftBanner">
            <img id="giftBannerAvatar" src="" class="gift-banner-avatar" referrerpolicy="no-referrer">
            <div class="gift-banner-text">
                <b id="giftBannerName">User</b>
                <span>Menerima Gift</span>
            </div>
            <div class="gift-banner-combo">
                <span class="combo-text">x</span><span class="combo-num" id="giftBannerCombo">1</span>
            </div>
        </div>

        <!-- Layer Animasi Gift Full 9:16 -->
        <div class="gift-overlay" id="giftOverlayContainer">
            <video id="giftVideo" crossorigin="anonymous" playsinline></video>
            <canvas id="giftCanvas"></canvas>
        </div>
    </div>

    <script>
        const channel = new BroadcastChannel('tiktok_live_channel');
        const slotPoints = {};
        for(let i=1; i<=8; i++) slotPoints[i] = 0;

        document.body.addEventListener('click', () => {
            const hVid = document.getElementById('hostVideo');
            if(hVid.paused && hVid.src) hVid.play().catch(()=>{});
        }, { once: true });

        channel.onmessage = (event) => {
            const data = event.data;

            if (data.type === 'UPDATE_HOST_LABEL') {
                document.getElementById('hostBottomText').innerText = data.label || 'Nama';
            } 
            else if (data.type === 'UPDATE_HOST_VIDEO') {
                document.getElementById('hostCameraImg').style.display = 'none';
                const videoElem = document.getElementById('hostVideo');
                const placeholder = document.getElementById('hostPlaceholder');
                if(videoElem.src !== data.src) {
                    videoElem.src = data.src;
                    videoElem.load();
                }
                videoElem.style.display = 'block';
                placeholder.style.display = 'none';
                videoElem.play().catch(() => {});
            } 
            else if (data.type === 'HOST_CAM_FRAME') {
                const camImg = document.getElementById('hostCameraImg');
                const placeholder = document.getElementById('hostPlaceholder');
                const videoElem = document.getElementById('hostVideo');

                if (videoElem.style.display !== 'none') videoElem.style.display = 'none';
                if (placeholder.style.display !== 'none') placeholder.style.display = 'none';

                camImg.src = data.frame;
                camImg.style.display = 'block';
            }
            else if (data.type === 'HOST_CAM_STOP') {
                const camImg = document.getElementById('hostCameraImg');
                const placeholder = document.getElementById('hostPlaceholder');
                camImg.style.display = 'none';
                camImg.src = "";
                placeholder.style.display = 'block';
            }
            else if (data.type === 'UPDATE_SLOT') {
                const { slotNum, nameInput, initialPoin, profileImg, action } = data;
                const slotBox = document.getElementById(`slot-${slotNum}`);
                const coinBadge = document.getElementById(`coin-badge-${slotNum}`);
                const coincountElem = document.getElementById(`coincount-slot-${slotNum}`);
                const namePill = document.getElementById(`namepill-slot-${slotNum}`);
                const nameText = document.getElementById(`nametext-slot-${slotNum}`);
                const micContainer = document.getElementById(`mic-slot-${slotNum}`);
                const imgElem = document.getElementById(`img-slot-${slotNum}`);
                const iconElem = document.getElementById(`icon-${slotNum}`);
                const reqElem = document.getElementById(`req-${slotNum}`);

                if (action === 'clear_slot') {
                    slotBox.classList.remove('active-media');
                    imgElem.style.display = 'none';
                    imgElem.removeAttribute('src');
                    iconElem.style.display = 'inline';
                    reqElem.style.display = 'inline';
                    namePill.style.display = 'none';
                    micContainer.style.display = 'none';
                    coinBadge.style.display = 'none';
                    slotPoints[slotNum] = 0;
                    return;
                }

                coinBadge.style.display = 'flex';
                if (initialPoin !== undefined) {
                    slotPoints[slotNum] = initialPoin;
                }
                coincountElem.innerText = formatPoin(slotPoints[slotNum]);

                if (nameInput) {
                    nameText.innerText = nameInput;
                    namePill.style.display = 'flex';
                    micContainer.style.display = 'flex';
                }

                if (profileImg) {
                    slotBox.classList.add('active-media');
                    iconElem.style.display = 'none';
                    reqElem.style.display = 'none';
                    imgElem.src = profileImg;
                    imgElem.style.display = 'block';
                }
            }
            else if (data.type === 'PLAY_GIFT') {
                const targetSlot = data.targetSlot;
                let targetName = `Slot ${targetSlot}`;
                let targetAvatar = "";

                if (targetSlot && slotPoints[targetSlot] !== undefined) {
                    slotPoints[targetSlot] += (data.increment || 44999);
                    document.getElementById(`coincount-slot-${targetSlot}`).innerText = formatPoin(slotPoints[targetSlot]);
                    
                    const nameElem = document.getElementById(`nametext-slot-${targetSlot}`);
                    const imgElem = document.getElementById(`img-slot-${targetSlot}`);
                    if (nameElem && nameElem.innerText) targetName = nameElem.innerText;
                    if (imgElem && imgElem.src) targetAvatar = imgElem.src;
                }

                // Tampilkan Banner Gift TikTok Asli
                showGiftBanner(targetName, targetAvatar);

                // Mainkan Animasi Gift Rasio 9:16 Sistem TikTok
                playGiftVideo(data.src);
            }
        };

        function showGiftBanner(name, avatar) {
            const banner = document.getElementById('tiktokGiftBanner');
            const bName = document.getElementById('giftBannerName');
            const bAvatar = document.getElementById('giftBannerAvatar');

            bName.innerText = name;
            if (avatar) {
                bAvatar.src = avatar;
                bAvatar.style.display = 'block';
            } else {
                bAvatar.style.display = 'none';
            }

            banner.style.display = 'flex';
        }

        function hideGiftBanner() {
            document.getElementById('tiktokGiftBanner').style.display = 'none';
        }

        function formatPoin(val) {
            if (val >= 1000000) {
                return (val / 1000000).toFixed(1).replace('.0', '') + 'M';
            } else if (val >= 1000) {
                return (val / 1000).toFixed(0) + 'K';
            }
            return val.toString();
        }

        // Engine Chroma Key HD TikTok Asli (Presisi 9:16)
        function playGiftVideo(src) {
            const overlayContainer = document.getElementById('giftOverlayContainer');
            const giftVideo = document.getElementById('giftVideo');
            const canvas = document.getElementById('giftCanvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';

            overlayContainer.style.display = 'block';
            if(giftVideo.src !== src) {
                giftVideo.src = src;
                giftVideo.load();
            }
            giftVideo.currentTime = 0;

            giftVideo.play().then(() => {
                // Auto penyesuaian rasio video
                if (giftVideo.videoHeight >= giftVideo.videoWidth) {
                    // Video 9:16 Vertikal -> Mengisi Layar Penuh (Cover 100%)
                    canvas.style.objectFit = 'cover';
                    canvas.style.objectPosition = 'center bottom';
                } else {
                    // Video 16:9 Horizontal -> Pas di Layar Panggung Tengah/Bawah
                    canvas.style.objectFit = 'contain';
                    canvas.style.objectPosition = 'center bottom';
                }

                function renderFrame() {
                    if (giftVideo.paused || giftVideo.ended) {
                        overlayContainer.style.display = 'none';
                        hideGiftBanner();
                        return;
                    }
                    if (giftVideo.videoWidth > 0 && giftVideo.videoHeight > 0) {
                        if (canvas.width !== giftVideo.videoWidth || canvas.height !== giftVideo.videoHeight) {
                            canvas.width = giftVideo.videoWidth;
                            canvas.height = giftVideo.videoHeight;
                            ctx.imageSmoothingEnabled = true;
                            ctx.imageSmoothingQuality = 'high';
                        }

                        ctx.drawImage(giftVideo, 0, 0, canvas.width, canvas.height);

                        try {
                            const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
                            const pixels = frame.data;

                            for (let i = 0; i < pixels.length; i += 4) {
                                let r = pixels[i];
                                let g = pixels[i + 1];
                                let b = pixels[i + 2];

                                let maxRB = Math.max(r, b);
                                let greenDiff = g - maxRB;

                                // Deteksi Green Screen Halus Tanpa Gerigi
                                if (greenDiff > 12 && g > 40) {
                                    let alphaFactor = Math.min(1, (greenDiff - 12) / 25);
                                    pixels[i + 3] = Math.floor((1 - alphaFactor) * 255);
                                } 
                                
                                // Pembersihan total sisa bayangan hijau pinggir (Green Spill)
                                if (pixels[i + 3] > 0 && g > (r + b) * 0.55) {
                                    pixels[i + 1] = Math.floor((r + b) / 2);
                                }
                            }
                            ctx.putImageData(frame, 0, 0);
                        } catch (e) {}
                    }
                    requestAnimationFrame(renderFrame);
                }
                requestAnimationFrame(renderFrame);
            }).catch(() => {
                overlayContainer.style.display = 'none';
                hideGiftBanner();
            });
        }
    </script>
</body>
</html>
